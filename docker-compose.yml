services:
  db:
    image: postgres:15
    container_name: lab-edu-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ${CORE_IMAGE}
    pull_policy: missing
    container_name: lab-edu-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LAB_ALLOWED_ORIGINS: ${LAB_ALLOWED_ORIGINS:-http://lab-edu.team,http://localhost:3000,http://127.0.0.1:3000}
      LAB_SECURITY_JWT_COOKIE_DOMAIN: ${LAB_SECURITY_JWT_COOKIE_DOMAIN:-}
      LAB_SECURITY_JWT_COOKIE_SECURE: ${LAB_SECURITY_JWT_COOKIE_SECURE:-false}
      LAB_SECURITY_JWT_COOKIE_SAME_SITE: ${LAB_SECURITY_JWT_COOKIE_SAME_SITE:-Lax}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE}
    pull_policy: missing
    container_name: lab-edu-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://core.lab-edu.team/api/v1}
      NEXT_PUBLIC_CORE_DOCS_URL: ${NEXT_PUBLIC_CORE_DOCS_URL:-http://core.lab-edu.team/swagger-ui.html}
    expose:
      - "3000"
    depends_on:
      - core

  nginx:
    image: nginx:1.27-alpine
    container_name: lab-edu-nginx
    ports:
      - "${ENTRY_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - core

volumes:
  db_data: