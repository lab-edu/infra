services:
  db:
    image: postgres:15
    container_name: lab-edu-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ${CORE_IMAGE}
    pull_policy: missing
    container_name: lab-edu-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LAB_CORS_ALLOWED_ORIGINS: ${LAB_CORS_ALLOWED_ORIGINS}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
      LAB_AI_OPENAI_BASE_URL: ${LAB_AI_OPENAI_BASE_URL}
      LAB_AI_OPENAI_API_KEY: ${LAB_AI_OPENAI_API_KEY}
      LAB_AI_OPENAI_MODEL: ${LAB_AI_OPENAI_MODEL}
      LAB_AI_OPENAI_TIMEOUT_SECONDS: ${LAB_AI_OPENAI_TIMEOUT_SECONDS}
    volumes:
      - ./data/uploads:/app/data/uploads
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE}
    pull_policy: missing
    container_name: lab-edu-web
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - core

  nginx:
    image: nginx:1.27-alpine
    container_name: lab-edu-nginx
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - core

volumes:
  db_data: